<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<defs>
<radialGradient id="g1" cx="78%" cy="45%" r="55%"><stop offset="0" stop-color="#00C9A7" stop-opacity=".30"/><stop offset="1" stop-color="#00C9A7" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#2C5364" stop-opacity=".6"/><stop offset="1" stop-color="#2C5364" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#00C9A7"/><stop offset="1" stop-color="#2C5364"/></linearGradient>
<linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9ff5e6"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
<clipPath id="rc"><rect width="900" height="320" rx="18"/></clipPath>
</defs>
<style>
.fl{animation:float 5s ease-in-out infinite}
.fl.b{animation-duration:6.5s}.fl.c{animation-duration:4.2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.sh{animation:shadow 5s ease-in-out infinite;transform-origin:700px 270px}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(.85);opacity:.35}}
.role{opacity:0;animation:cyc 8s infinite}
.r0{animation-delay:0s}.r1{animation-delay:2s}.r2{animation-delay:4s}.r3{animation-delay:6s}
@keyframes cyc{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ring{stroke-dasharray:6 10;animation:spin 24s linear infinite;transform-origin:700px 170px}
.ring.rev{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
.scan{animation:scan 6s linear infinite}@keyframes scan{from{transform:translateX(-160px) skewX(-18deg)}to{transform:translateX(1060px) skewX(-18deg)}}
</style>
<rect width="900" height="320" rx="18" fill="#080d12"/>
<rect width="900" height="320" rx="18" fill="url(#grid)"/>
<rect width="900" height="320" rx="18" fill="url(#g1)" class="pulse"/>
<rect width="900" height="320" rx="18" fill="url(#g2)"/>
<g clip-path="url(#rc)"><rect class="scan" y="0" width="90" height="320" fill="#00C9A7" opacity=".07"/></g>
<ellipse class="ring" cx="700" cy="170" rx="190" ry="82" fill="none" stroke="#00C9A7" stroke-opacity=".35"/>
<ellipse class="ring rev" cx="700" cy="170" rx="130" ry="56" fill="none" stroke="#5eead4" stroke-opacity=".25"/>
<circle r="5" fill="#00C9A7"><animateMotion dur="9s" repeatCount="indefinite" path="M510,170 a190,82 0 1,1 380,0 a190,82 0 1,1 -380,0"/></circle>
<circle r="3.5" fill="#fff"><animateMotion dur="6s" repeatCount="indefinite" path="M570,170 a130,56 0 1,0 260,0 a130,56 0 1,0 -260,0"/></circle>
<ellipse class="sh" cx="700" cy="270" rx="95" ry="16" fill="#000" filter="url(#blur)"/>
<g class="fl a" style="animation-delay:0s"><polygon points="629.4,135.0 690,170 690,240 629.4,205.0" fill="#0e7f73"/><polygon points="690,170 750.6,135.0 750.6,205.0 690,240" fill="#0a5a66"/><polygon points="690,100 750.6,135.0 690,170 629.4,135.0" fill="#5eead4"/><polyline points="690,100 750.6,135.0 690,170 629.4,135.0" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/><line x1="690" y1="170" x2="690" y2="240" stroke="#fff" stroke-opacity=".18"/></g><g class="fl b" style="animation-delay:0.8s"><polygon points="751.9,98.0 790,120 790,164 751.9,142.0" fill="#139488"/><polygon points="790,120 828.1,98.0 828.1,142.0 790,164" fill="#0d6f7a"/><polygon points="790,76 828.1,98.0 790,120 751.9,98.0" fill="#7ff0dc"/><polyline points="790,76 828.1,98.0 790,120 751.9,98.0" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/><line x1="790" y1="120" x2="790" y2="164" stroke="#fff" stroke-opacity=".18"/></g><g class="fl c" style="animation-delay:1.6s"><polygon points="580.6,83.0 610,100 610,134 580.6,117.0" fill="#1aa99b"/><polygon points="610,100 639.4,83.0 639.4,117.0 610,134" fill="#128a92"/><polygon points="610,66 639.4,83.0 610,100 580.6,83.0" fill="#a7f3e6"/><polyline points="610,66 639.4,83.0 610,100 580.6,83.0" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/><line x1="610" y1="100" x2="610" y2="134" stroke="#fff" stroke-opacity=".18"/></g><g class="fl b" style="animation-delay:2.2s"><polygon points="775.8,201.0 800,215 800,243 775.8,229.0" fill="#0e7f73"/><polygon points="800,215 824.2,201.0 824.2,229.0 800,243" fill="#0a5a66"/><polygon points="800,187 824.2,201.0 800,215 775.8,201.0" fill="#5eead4"/><polyline points="800,187 824.2,201.0 800,215 775.8,201.0" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/><line x1="800" y1="215" x2="800" y2="243" stroke="#fff" stroke-opacity=".18"/></g>
<text x="56" y="70" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" fill="#00C9A7">~/coll-ins <tspan fill="#5b6b76">on</tspan> main <tspan fill="#28c840">&#9679;</tspan></text>
<text x="56" y="150" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Collins Maina</text>
<rect x="58" y="168" width="70" height="4" rx="2" fill="url(#bar)"/>
<text x="56" y="206" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#9fb0ba">Software engineer &#183; Nairobi, Kenya</text>
<text x="56" y="240" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" fill="#5b6b76">currently building &#8594;</text>
<text class="role r0" x="244" y="240" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" fill="#5eead4">web apps<tspan fill="#00C9A7" class="cur">_</tspan></text><text class="role r1" x="244" y="240" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" fill="#5eead4">automation<tspan fill="#00C9A7" class="cur">_</tspan></text><text class="role r2" x="244" y="240" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" fill="#5eead4">APIs<tspan fill="#00C9A7" class="cur">_</tspan></text><text class="role r3" x="244" y="240" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" fill="#5eead4">agents<tspan fill="#00C9A7" class="cur">_</tspan></text>
</svg>